[workspace]
members = [
    "crates/vortex-core",
    "crates/vortex-storage",
    "crates/vortex-guard",
    "crates/vortex-protocol",
    "crates/vortex-server",
    "crates/vortex-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Vortex Contributors"]
license = "Apache-2.0"

[workspace.dependencies]
tokio = { version = "1.38", features = ["full"] }
bytes = "1.6"
blake3 = "1.5"
crc32fast = "1.4"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
memmap2 = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3.10"
